run_id: starvla_loopoft_robocasa
run_root_dir: results/Checkpoints
seed: 42
trackers: [jsonl, wandb]
wandb_entity: your_wandb_entity
wandb_project: loopoft
is_debug: false


framework:
  name: LoopOFT
  is_training: true
  use_teacher_llm: false
  use_entropy_loss: false
  halting_entropy_weight: 0.0001
  qwenvl:
    base_vlm: loopvlm
    attn_implementation: eager
    vlm_path: /memory/shenboyang/myCache/huggingface/hub/Qwen--Qwen3-VL-2B-Instruct/
    pretrained_weights_path: /memory/shenboyang/myCache/huggingface/hub/Qwen--Qwen3-VL-2B-Instruct/model.safetensors

    # ===== Loop 相关参数 =====
    loop_token_id: 140000
    as_student: true
    num_preserved_layers: 24
    num_loop: 1
    stop_threshold: 0.32
    halting_query_num: 3
    halting_cross_attn_layers: 2

  dino:
    dino_backbone: dinov2_vits14

  action_model:
    action_model_type: OFT
    action_dim: 29
    state_dim: 58
    future_action_window_size: 15
    action_horizon: 16
    past_action_window_size: 0

  teacher_loss_weight: 0.1
  teacher_loss_decay_steps: 1000

  # Loop effectiveness loss parameters
  use_loop_effectiveness_loss: false
  loop_effectiveness_weight: 1.0

  # Cosine similarity loss parameter
  use_cosine_loss: true
  cosine_loss_weight: 0.01

  # Loss update counter parameter
  max_loss_updates: 500

  reduce_in_full_precision: true


datasets:
  vla_data:
    dataset_py: lerobot_datasets
    data_root_dir: /memory/shenboyang/myCache/starvla/robocase_dataset/PhysicalAI-Robotics-GR00T-X-Embodiment-Sim/
    data_mix: fourier_gr1_unified_1000
    action_type: delta_ee
    CoT_prompt: "Your task is {instruction}. To identify the key objects for your task. Locate their bounding boxes in [x1,y1,x2,y2] format."
    CoT_answer: bbox
    default_image_resolution: [3, 224, 224]
    per_device_batch_size: 16
    load_all_data_for_training: true
    obs: ["image_0"]
    video_backend: torchvision_av


trainer:
  epochs: 100
  max_train_steps: 100000
  num_warmup_steps: 5000
  save_interval: 10000
  eval_interval: 100
  learning_rate:
    base: 2.5e-05
    qwen_vl_interface: 1.0e-05
    action_model: 1.0e-04

  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06

  freeze_modules: "action_model,\
    qwen_vl_interface.model.visual,\
    qwen_vl_interface.model.language_model.layers,\
    qwen_vl_interface.model.language_model.embed_tokens,\
    qwen_vl_interface.model.language_model.norm,\
    qwen_vl_interface.model.language_model.rotary_emb"

  loss_scale:
    vla: 1.0
    vlm: 0.1
  max_grad_norm: 1.0
  warmup_ratio: 0.1
  weight_decay: 0.0
  logging_frequency: 10
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1

  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08

  resume_epoch: null
  resume_step: null
  enable_gradient_checkpointing: true
  enable_mixed_precision_training: true
